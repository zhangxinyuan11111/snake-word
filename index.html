<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --panel: #27273a;
      --grid: #2f2f45;
      --snake: #a6e3a1;
      --snake-head: #94e2d5;
      --food: #f38ba8;
      --text: #cdd6f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }

    .score-row {
      display: flex;
      gap: 24px;
      font-size: 16px;
    }

    canvas {
      background: var(--panel);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .tip { font-size: 13px; color: #7f849c; }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(30, 30, 46, 0.85);
    }
    .overlay.show { display: flex; }
    .overlay h2 { margin: 0; font-size: 28px; }
    .overlay button {
      padding: 10px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: var(--snake);
      color: #1e1e2e;
      cursor: pointer;
      font-weight: 600;
    }
    .overlay button:hover { background: var(--snake-head); }

    .wrap { position: relative; }
  </style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="score-row">
    <span>得分：<strong id="score">0</strong></span>
    <span>最高：<strong id="best">0</strong></span>
  </div>

  <div class="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">游戏结束</h2>
      <button id="restart">重新开始</button>
    </div>
  </div>

  <p class="tip">方向键 / WASD 控制方向 · 空格暂停 · 吃到食物得分</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');

    const GRID = 20;                 // 每格像素
    const COLS = canvas.width / GRID;   // 20
    const ROWS = canvas.height / GRID;  // 20

    let snake, dir, nextDir, food, score, best, timer, running, paused;

    best = Number(localStorage.getItem('snake-best') || 0);
    bestEl.textContent = best;

    function reset() {
      snake = [{ x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }];
      dir = { x: 1, y: 0 };
      nextDir = dir;
      score = 0;
      scoreEl.textContent = 0;
      running = true;
      paused = false;
      overlay.classList.remove('show');
      placeFood();
      clearInterval(timer);
      timer = setInterval(tick, 120);
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function tick() {
      if (!running || paused) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // 撞墙
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();

      // 撞自己
      if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      running = false;
      clearInterval(timer);
      if (score > best) {
        best = score;
        localStorage.setItem('snake-best', best);
        bestEl.textContent = best;
      }
      overlayTitle.textContent = '游戏结束';
      overlay.classList.add('show');
    }

    function draw() {
      ctx.fillStyle = '#27273a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 网格线
      ctx.strokeStyle = '#2f2f45';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
      }

      // 食物
      ctx.fillStyle = '#f38ba8';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // 蛇
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#94e2d5' : '#a6e3a1';
        ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
      });
    }

    function setDirection(x, y) {
      // 禁止 180 度掉头
      if (dir.x === -x && dir.y === -y) return;
      nextDir = { x, y };
    }

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': e.preventDefault(); setDirection(0, -1); break;
        case 'ArrowDown': case 's': case 'S': e.preventDefault(); setDirection(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); setDirection(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': e.preventDefault(); setDirection(1, 0); break;
        case ' ': e.preventDefault(); togglePause(); break;
      }
    });

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        overlayTitle.textContent = '已暂停';
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }

    document.getElementById('restart').addEventListener('click', reset);

    reset();
    draw();
  </script>
</body>
</html>
